name: ZMT Android APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build ZMT APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZMT-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          retention-days: 7
